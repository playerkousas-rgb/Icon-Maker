name: guard

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '17 3 * * 1'   # 每週一 HKT 11:17 掃一次，防止「靜靜變肥」

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A16：Actions pin exact release commit，避免浮動 tag 被供應鏈竄改。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Guard (docs / secrets / size / links)
        run: node scripts/guard.mjs
      - name: Check Vercel homepage deployment copy
        run: node scripts/sync_index_v1.0.mjs --check
      - name: Audit versioned single HTML
        run: |
          node scripts/audit_single_html_v1.0.mjs icon_maker_v1.0.html
          node scripts/audit_single_html_v1.0.mjs index.html
      - name: Brain guard tests (F14)
        if: hashFiles('**/*.test.mjs') != ''
        run: node --test
      - name: Size gate (S7)
        if: hashFiles('package.json') != ''
        run: |
          if [ -d dist ]; then
            BYTES=$(du -sb dist | cut -f1)
            echo "dist = $BYTES bytes"
            [ "$BYTES" -lt 5242880 ] || { echo "::error::dist >= 5MB (S7)"; exit 1; }
          fi
      - name: Dependency audit (A16)
        if: hashFiles('package-lock.json') != ''
        run: npm audit --audit-level=high
